<!DOCTYPE html>
<html lang="pt-BR">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Adriano Camargo | Dev Portfolio</title>
    <meta name="description" content="Portfólio de Adriano Camargo - Desenvolvedor Fullstack e Especialista em Automação.">
    <link rel="icon" type="image/svg+xml" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'%3E%3Crect width='100' height='100' rx='20' fill='%231e1e1e'/%3E%3Cpath d='M35 30 L15 50 L35 70' stroke='%23569cd6' stroke-width='10' fill='none' stroke-linecap='round' stroke-linejoin='round'/%3E%3Cpath d='M65 30 L85 50 L65 70' stroke='%23569cd6' stroke-width='10' fill='none' stroke-linecap='round' stroke-linejoin='round'/%3E%3Cline x1='62' y1='20' x2='38' y2='80' stroke='%23ce9178' stroke-width='10' stroke-linecap='round'/%3E%3C/svg%3E">
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Fira+Code:wght@300;400;500;600&family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <script>
      tailwind.config = {
        darkMode: 'class',
        theme: {
          extend: {
            fontFamily: {
              sans: ['Inter', 'sans-serif'],
              mono: ['"Fira Code"', 'monospace'],
            },
            colors: {
              vscode: {
                bg: '#1e1e1e',
                sidebar: '#252526',
                activity: '#333333',
                tab: '#2d2d2d',
                activeTab: '#1e1e1e',
                accent: '#007acc',
                text: '#e0e0e0', /* Aumentado brilho para melhor contraste (A11y) */
                green: '#4ec9b0',
                orange: '#ce9178',
                blue: '#569cd6',
                purple: '#c586c0',
                yellow: '#dcdcaa',
                comment: '#858585' /* Cor específica para comentários com melhor contraste */
              }
            },
            animation: {
              'blob': 'blob 7s infinite',
              'cursor': 'cursor .75s step-end infinite',
            },
            keyframes: {
              blob: {
                '0%': { transform: 'translate(0px, 0px) scale(1)' },
                '33%': { transform: 'translate(30px, -50px) scale(1.1)' },
                '66%': { transform: 'translate(-20px, 20px) scale(0.9)' },
                '100%': { transform: 'translate(0px, 0px) scale(1)' },
              },
              cursor: {
                '0%, 100%': { opacity: '1' },
                '50%': { opacity: '0' },
              }
            }
          }
        }
      }
    </script>
    <style>
      body {
        background-color: #1e1e1e;
        color: #e0e0e0;
        overflow: hidden; /* App handles scrolling */
      }
      /* Custom Scrollbar for Webkit */
      ::-webkit-scrollbar {
        width: 10px;
        height: 10px;
      }
      ::-webkit-scrollbar-track {
        background: #1e1e1e; 
      }
      ::-webkit-scrollbar-thumb {
        background: #424242; 
        border-radius: 5px;
      }
      ::-webkit-scrollbar-thumb:hover {
        background: #4f4f4f; 
      }
      
      /* Subtle Aurora Background */
      .aurora-bg {
        background: radial-gradient(circle at 50% 50%, rgba(86, 156, 214, 0.05) 0%, rgba(30, 30, 30, 0) 50%);
        position: absolute;
        width: 100%;
        height: 100%;
        z-index: 0;
        pointer-events: none;
      }

      /* Easter Egg Animation: Shake */
      @keyframes shake {
        0% { transform: translate(1px, 1px) rotate(0deg); }
        10% { transform: translate(-1px, -2px) rotate(-1deg); }
        20% { transform: translate(-3px, 0px) rotate(1deg); }
        30% { transform: translate(3px, 2px) rotate(0deg); }
        40% { transform: translate(1px, -1px) rotate(1deg); }
        50% { transform: translate(-1px, 2px) rotate(-1deg); }
        60% { transform: translate(-3px, 1px) rotate(0deg); }
        70% { transform: translate(3px, 1px) rotate(-1deg); }
        80% { transform: translate(-1px, -1px) rotate(1deg); }
        90% { transform: translate(1px, 2px) rotate(0deg); }
        100% { transform: translate(1px, -2px) rotate(-1deg); }
      }
      .animate-shake {
        animation: shake 0.5s;
        animation-iteration-count: 1;
      }
    </style>

{
  "imports": {
    "react": "https://esm.sh/react@18.2.0",

    "react-dom/client": "https://esm.sh/react-dom@18.2.0/client",
    "react-helmet-async": "https://esm.sh/react-helmet-async@2.0.4?external=react,react-dom"
  }
}
</script>
</head>

    <div id="root"></div>
  </body>
</html>
